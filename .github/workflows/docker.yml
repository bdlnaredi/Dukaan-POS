name: Build image
on:
  push:
    branches: [main]
    paths: ["app/**", "Dockerfile", "CHANGELOG.md", ".github/workflows/docker.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: GST maths (server and app agree)
        run: python tests/gst_compare.py
      - name: Server against a stand-in Tally
        run: python tests/test_server.py
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dukaan:latest
            ghcr.io/${{ github.repository_owner }}/dukaan:${{ github.sha }}
