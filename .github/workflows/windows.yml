name: Build Windows app

on:
  push:
    branches: [main]
    paths: ["app/**", "windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check pyinstaller pystray pillow

      - name: Build the app
        env:
          BUILD_NUMBER: ${{ github.run_number }}

        run: |
          python windows/build.py *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE) { exit 1 }
          $v = (Select-String -Path build.log -Pattern '^VERSION=(.+)$').Matches[0].Groups[1].Value
          "APP_VERSION=$v" >> $env:GITHUB_ENV

      - name: Check the app starts
        run: |
          $p = Start-Process "dist\Dukaan\Dukaan.exe" -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\Dukaan\app.log" -Tail 20
          if ($p.ExitCode -ne 0) { Write-Error "Self test failed"; exit 1 }

      - name: Make the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $title = if ($env:STORE_NAME) { $env:STORE_NAME } else { "Dukaan" }
          & $iscc /Qp "/DAppName=Dukaan" "/DAppTitle=$title" "/DAppVersion=$env:APP_VERSION" "/DAppId={{8e6c3955-62dc-4aeb-a6f0-df0300b4e9a2}" "/DServerExe=Dukaan.exe" "/DServerPath=Dukaan.exe"  windows\installer.iss
          if ($LASTEXITCODE) { exit 1 }

      - name: Test the installer
        run: |
          $p = Start-Process "dist\Dukaan-Setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode) { Write-Error "Installer failed: $($p.ExitCode)"; exit 1 }
          $p = Start-Process "$env:ProgramFiles\Dukaan\Dukaan.exe" -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\Dukaan\app.log" -Tail 5
          if ($p.ExitCode -ne 0) { Write-Error "Installed app failed its self test"; exit 1 }
          Get-NetFirewallRule -DisplayName "Dukaan" | Format-Table DisplayName, Enabled, Direction, Action
          $p = Start-Process "$env:ProgramFiles\Dukaan\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait -PassThru
          if (Test-Path "$env:ProgramFiles\Dukaan\Dukaan.exe") { Write-Error "Uninstall left the app behind"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Dukaan-Windows
          path: dist/Dukaan-Setup.exe

      - name: Publish to the windows-latest release
        if: ${{ vars.PUBLISH_APKS != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Windows installer for Dukaan, built from $env:GITHUB_SHA. Download Dukaan-Setup.exe and run it. If Windows shows 'Windows protected your PC', click More info, then Run anyway."
          gh release view windows-latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit windows-latest --title "Windows app (build $env:GITHUB_RUN_NUMBER)" --notes "$notes" --prerelease
          } else {
            gh release create windows-latest --title "Windows app (build $env:GITHUB_RUN_NUMBER)" --notes "$notes" --prerelease --latest=false
          }
          gh release upload windows-latest "dist/Dukaan-Setup.exe" --clobber
          if ($LASTEXITCODE) { exit 1 }
